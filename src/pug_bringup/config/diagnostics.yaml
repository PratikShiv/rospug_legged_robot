analyzers:
  ros__parameters:
    path: Robot
    jetson:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Jetson
      startswith: ['jetson_monitor']

    teleop:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Teleop
      startswith: ['pug_teleop']

    display:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Display
      startswith: ['oled_display']

